[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anam"
version = "1.0.0"
description = "ANAM — منصة ذكاء المستجدات: تلتقط وتحلل وتشخص كل جديد في عالم البرمجيات والذكاء الاصطناعي وتحوّله إلى تقارير عربية عملية"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ANAM" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
anam = "anam.cli:main"

[tool.setuptools.packages.find]
include = ["anam*"]
