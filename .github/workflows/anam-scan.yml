name: ANAM — مسح مجدول بدون توقف

# يعمل كل 6 ساعات تلقائياً على بنية GitHub المجانية — لا سيرفر، لا مفتاح مدفوع.
# النتيجة: تقارير محدثة تُحفظ كـ artifacts، ويمكن تفعيل الالتزام التلقائي بسهولة.
on:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:        # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تشغيل ANAM (الوضع العادي)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m anam.cli scan --mode normal

      - name: حفظ التقارير كـ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anam-reports-${{ github.run_number }}
          path: reports/
          retention-days: 90

      # اختياري: نشر التقارير داخل المستودع بدلاً من artifacts فقط — ألغِ التعليق بحذر:
      # - name: الالتزام بالتقارير
